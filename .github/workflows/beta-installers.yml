name: Beta installers
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: all
        options: [all, macos, windows-2022, macos-15, macos-15-intel]
      product:
        description: Application to build
        type: choice
        default: all
        options: [all, Live]
  push:
    tags: ['v*-beta.*']
env:
  PYTHONUTF8: "1"
  SP_BUILD_PRODUCT: ${{ inputs.product || 'all' }}
permissions:
  contents: read
jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows-2022' && '["windows-2022"]' || inputs.platform == 'macos-15' && '["macos-15"]' || inputs.platform == 'macos-15-intel' && '["macos-15-intel"]' || inputs.platform == 'macos' && '["macos-15", "macos-15-intel"]' || '["windows-2022", "macos-15", "macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Download released OCR models
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download ocr-models-v0.7-v0.2 --pattern "secretariatpro-ocr-models-v0.7-v0.2.zip" --dir .
      - name: Restore verified OCR models
        run: python packaging/unpack_models.py secretariatpro-ocr-models-v0.7-v0.2.zip
      - name: Update build tooling
        run: python -m pip install --upgrade "pip>=26.2.1" setuptools wheel
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: python -m pip install -r requirements.txt -r requirements-test.txt -c constraints-macos.txt
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Audit Python build dependencies
        run: python packaging/audit_dependencies.py
      - name: Build and verify Svelte broadcast renderer
        run: |
          npm ci --prefix broadcast_renderer --no-fund --no-audit
          npm run verify --prefix broadcast_renderer
          npm audit --prefix broadcast_renderer --audit-level=high
      - name: Verify invitation database boundary
        run: |
          npm ci --prefix security_tests --no-fund --no-audit
          npm audit --prefix security_tests --audit-level=high
          npm test --prefix security_tests
      - name: Audit and regression tests
        run: python packaging/run_regressions.py
      - name: Check JavaScript
        run: |
          node --check overlay_motion.js
          node --check script.js
          node --check webapp/app.js
          node --test tests/ocr_preview.test.cjs tests/overlay_presentation.test.cjs tests/manager_identity.test.cjs tests/overlay_motion.test.cjs
          node --check manager_app/app.js
      - name: Record resolved dependencies
        run: python -m pip freeze > resolved-dependencies.txt
      - name: Prepare offline base recognizer (Windows)
        if: runner.os == 'Windows'
        run: python packaging/prepare_windows_ocr.py
      - name: Build Live and OCR
        run: |
          python -m PyInstaller --noconfirm --clean SecretariatPro_App.spec
          python -m PyInstaller --noconfirm --clean SecretariatPro_OCR.spec
      - name: Build Manager
        if: inputs.product != 'Live'
        run: python -m PyInstaller --noconfirm --clean SecretariatPro_Manager.spec
      - name: Prepare Windows installer prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows-prerequisites.ps1
      - name: Verify packaged camera and OCR runtimes
        run: python packaging/check_worker.py
      - name: Assemble installer
        run: python packaging/assemble.py
      - name: Smoke test installed applications (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/smoke-windows.ps1
      - name: Smoke test applications from DMG (macOS)
        if: runner.os == 'macOS'
        run: python packaging/smoke_macos.py
      - uses: actions/upload-artifact@v7
        with:
          name: SecretariatPro-beta-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.sha256
            release/smoke-*.log
            release/dependency-audit.json
            resolved-dependencies.txt
          if-no-files-found: error
          retention-days: 30
