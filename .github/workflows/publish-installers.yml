name: Publish verified installers
on:
  workflow_dispatch:
    inputs:
      windows_run:
        description: Successful Windows installer run
        required: true
        type: string
      macos_arm_run:
        description: Successful Apple Silicon installer run
        required: true
        type: string
      macos_intel_run:
        description: Successful Intel Mac installer run
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WINDOWS_RUN: ${{ inputs.windows_run }}
      MACOS_ARM_RUN: ${{ inputs.macos_arm_run }}
      MACOS_INTEL_RUN: ${{ inputs.macos_intel_run }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify builds and publish each application separately
        run: python packaging/publish_installers.py
