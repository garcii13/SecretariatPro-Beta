name: Publish verified installers
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Beta installers run with all three platforms
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify build and retrieve installers
        run: python packaging/publish_installers.py
