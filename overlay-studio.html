<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecretariatPro Broadcast Studio</title>
  <link rel="stylesheet" href="/styles.css?v=phase57-competition-flags&release=beta12-text-fit">
  <link rel="stylesheet" href="/overlay_cinematic.css?v=studio1">
  <link rel="stylesheet" href="/overlay_studio/studio.css?v=beta12-text-fit">
</head>
<body>
  <div id="broadcast-root"></div>
  <script>
    // A missing/corrupt bundle must recover the established OBS source as well.
    document.addEventListener('DOMContentLoaded', function () {
      if (window.secretariatStudioReady) return;
      const fallback = new URL('/overlay.html', location.href);
      fallback.search = location.search;
      fallback.searchParams.set('renderer', 'legacy');
      location.replace(fallback);
    });
  </script>
  <script src="/overlay_studio/studio.js?v=beta12-text-fit" defer></script>
</body>
</html>
